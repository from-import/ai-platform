spring:
  application:
    name: ai-platform
  mvc:
    async:
      request-timeout: ${CHAT_STREAM_TIMEOUT:5m}
  datasource:
    url: ${AI_PLATFORM_DB_URL:jdbc:mysql://localhost:3306/ai_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${AI_PLATFORM_DB_USERNAME:ai_platform_app}
    password: ${AI_PLATFORM_DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: org.frostnova.aigateway
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-}] "

auth:
  registration-enabled: ${AUTH_REGISTRATION_ENABLED:true}
  session-ttl: ${AUTH_SESSION_TTL:12h}

ai:
  gateway:
    providers:
      gemini:
        base-url: https://generativelanguage.googleapis.com
        api-key-env: GEMINI_API_KEY
        enabled: true
        supported-models:
          - gemini-3.6-flash
          - gemini-3.5-flash
          - gemini-3.5-flash-lite
          - gemini-3.1-pro-preview
          - gemini-3.1-flash-lite
          - gemini-2.5-pro
          - gemini-2.5-flash
          - gemini-2.5-flash-lite
          - gemini-flash-latest

      groq:
        base-url: https://api.groq.com/openai/v1
        api-key-env: GROQ_API_KEY
        enabled: true
        supported-models:
          - llama-3.3-70b-versatile
          - llama-3.1-8b-instant
          - openai/gpt-oss-120b
          - openai/gpt-oss-20b
          - groq/compound
          - groq/compound-mini
          - qwen/qwen3.6-27b
