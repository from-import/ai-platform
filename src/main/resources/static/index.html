<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Gateway Demo</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8f7;
            --panel: #ffffff;
            --text: #17211d;
            --muted: #66736e;
            --line: #dbe3df;
            --accent: #0f8f6f;
            --accent-strong: #087557;
            --danger: #b42318;
            --code: #eef4f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.15;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .status {
            min-width: 150px;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        .status.busy {
            color: var(--accent-strong);
        }

        .status.error {
            color: var(--danger);
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        section {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            padding: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 650;
        }

        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            font: inherit;
        }

        select {
            height: 42px;
            padding: 0 10px;
            margin-bottom: 16px;
        }

        textarea {
            min-height: 220px;
            padding: 12px;
            resize: vertical;
            line-height: 1.5;
        }

        textarea:focus,
        select:focus {
            outline: 3px solid rgba(15, 143, 111, 0.14);
            border-color: var(--accent);
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 16px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-strong);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .answer {
            min-height: 260px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--code);
            white-space: pre-wrap;
            line-height: 1.55;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 14px;
        }

        .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            background: #fff;
        }

        .metric span {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .metric strong {
            display: block;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .error-text {
            color: var(--danger);
        }

        @media (max-width: 760px) {
            main {
                width: min(100% - 24px, 980px);
                padding: 24px 0;
            }

            header,
            .workspace {
                display: block;
            }

            .status {
                margin-top: 16px;
                text-align: left;
            }

            section + section {
                margin-top: 16px;
            }

            .meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>AI Gateway Demo</h1>
            <p class="subtitle">Send one request through the Spring Boot gateway and inspect the model response.</p>
        </div>
        <div id="status" class="status">Ready</div>
    </header>

    <div class="workspace">
        <section>
            <label for="model">Model</label>
            <select id="model">
                <option value="gemini/gemini-flash-latest">gemini/gemini-flash-latest</option>
                <option value="groq/llama-3.3-70b-versatile">groq/llama-3.3-70b-versatile</option>
            </select>

            <label for="prompt">Prompt</label>
            <textarea id="prompt">Explain how AI works in a few words</textarea>

            <button id="sendButton" type="button">Send Request</button>
        </section>

        <section>
            <label>Response</label>
            <div id="answer" class="answer">The model response will appear here.</div>

            <div class="meta">
                <div class="metric">
                    <span>Provider</span>
                    <strong id="provider">-</strong>
                </div>
                <div class="metric">
                    <span>Prompt Tokens</span>
                    <strong id="promptTokens">-</strong>
                </div>
                <div class="metric">
                    <span>Completion Tokens</span>
                    <strong id="completionTokens">-</strong>
                </div>
            </div>
        </section>
    </div>
</main>

<script>
    const statusEl = document.querySelector("#status");
    const answerEl = document.querySelector("#answer");
    const providerEl = document.querySelector("#provider");
    const promptTokensEl = document.querySelector("#promptTokens");
    const completionTokensEl = document.querySelector("#completionTokens");
    const sendButton = document.querySelector("#sendButton");
    const promptEl = document.querySelector("#prompt");
    const modelEl = document.querySelector("#model");

    function setStatus(text, state = "") {
        statusEl.textContent = text;
        statusEl.className = `status ${state}`.trim();
    }

    function setMetadata(response) {
        providerEl.textContent = response.providerName || "-";
        promptTokensEl.textContent = response.promptTokens ?? "-";
        completionTokensEl.textContent = response.completionTokens ?? "-";
    }

    async function sendRequest() {
        const userMessage = promptEl.value.trim();
        if (!userMessage) {
            setStatus("Prompt is required", "error");
            promptEl.focus();
            return;
        }

        sendButton.disabled = true;
        answerEl.classList.remove("error-text");
        answerEl.textContent = "Waiting for model response...";
        setMetadata({});
        setStatus("Calling gateway...", "busy");

        try {
            const response = await fetch("/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: modelEl.value,
                    userMessage
                })
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(payload.message || payload.error || `Request failed with HTTP ${response.status}`);
            }

            answerEl.textContent = payload.content || "(empty response)";
            setMetadata(payload);
            setStatus("Done");
        } catch (error) {
            answerEl.classList.add("error-text");
            answerEl.textContent = error.message;
            setStatus("Error", "error");
        } finally {
            sendButton.disabled = false;
        }
    }

    sendButton.addEventListener("click", sendRequest);
    promptEl.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            sendRequest();
        }
    });
</script>
</body>
</html>
